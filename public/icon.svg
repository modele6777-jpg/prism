<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="60"  cy="80"  r="1.5" opacity="0.7"/>
    <circle cx="420" cy="55"  r="1"   opacity="0.5"/>
    <circle cx="460" cy="130" r="2"   opacity="0.8"/>
    <circle cx="90"  cy="200" r="1.2" opacity="0.6"/>
    <circle cx="400" cy="300" r="1.5" opacity="0.7"/>
    <circle cx="70"  cy="380" r="1"   opacity="0.5"/>
    <circle cx="450" cy="420" r="2"   opacity="0.8"/>
    <circle cx="130" cy="460" r="1.2" opacity="0.6"/>
    <circle cx="380" cy="460" r="1.5" opacity="0.5"/>
    <circle cx="200" cy="60"  r="1"   opacity="0.6"/>
    <circle cx="300" cy="80"  r="2.5" opacity="0.9"/>
    <circle cx="480" cy="250" r="1"   opacity="0.4"/>
    <circle cx="30"  cy="300" r="1.5" opacity="0.6"/>
    <circle cx="170" cy="420" r="1"   opacity="0.5"/>
    <circle cx="340" cy="180" r="1.2" opacity="0.4"/>
    <circle cx="100" cy="140" r="3"   opacity="0.7"/>
    <circle cx="430" cy="370" r="1.5" opacity="0.6"/>
    <circle cx="50"  cy="460" r="1"   opacity="0.4"/>
  </g>

  <!-- Clover-key symbol (white line-art, no fill) -->
  <!-- Four-leaf clover: 4 circles arranged in 2x2 grid -->
  <g fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-left petal -->
    <circle cx="218" cy="190" r="52"/>
    <!-- Top-right petal -->
    <circle cx="294" cy="190" r="52"/>
    <!-- Bottom-left petal -->
    <circle cx="218" cy="262" r="52"/>
    <!-- Bottom-right petal -->
    <circle cx="294" cy="262" r="52"/>
    <!-- Key shaft -->
    <line x1="256" y1="305" x2="256" y2="410"/>
    <!-- Key teeth -->
    <polyline points="256,370 280,370 280,385 256,385"/>
    <polyline points="256,395 272,395 272,410 256,410"/>
  </g>
</svg>