<!doctype html>
<html lang="ko">
  <head>
    <script>
      // 0-A. Third-Party Extension & MetaMask / Web3 Error Shield
      (function() {
        function isExtensionOrWalletError(err) {
          if (!err) return false;
          var msg = String(err.message || err.reason?.message || err.reason || err || '');
          var stack = String(err.stack || err.reason?.stack || '');
          var filename = String(err.filename || '');
          var combined = msg + ' ' + stack + ' ' + filename;
          return /MetaMask|ethereum|web3|evmProvider|inpage\.js|contentscript|chrome-extension|moz-extension|safari-extension|Failed to connect to MetaMask|walletconnect|phantom/i.test(combined);
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionOrWalletError(event.reason || event)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isExtensionOrWalletError(event.error || event.message || event)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
          }
        }, true);
      })();

      // 0-B. Prevent "Cannot set property fetch of #<Window> which has only a getter" across all environments
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var assignedFetch = originalFetch;
            var fetchPropDesc = {
              get: function() {
                return assignedFetch;
              },
              set: function(val) {
                assignedFetch = val;
              },
              configurable: true,
              enumerable: true
            };
            try {
              Object.defineProperty(window, 'fetch', fetchPropDesc);
            } catch (e1) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', fetchPropDesc);
              } catch (e2) {}
            }
          }
        } catch (fetchErr) {
          console.warn("[FetchShield] Failed to patch fetch setter", fetchErr);
        }
      })();

      // 1. Safe Chunk Recovery Shield for Orb Standalone
      (function() {
        var recoveryKey = 'prism_orb_chunk_recovery_at';
        var recovering = false;

        function recoverFromStaleAssets() {
          if (recovering) return;
          var lastRecovery = Number(sessionStorage.getItem(recoveryKey) || 0);
          if (Date.now() - lastRecovery < 30000) return;

          recovering = true;
          sessionStorage.setItem(recoveryKey, String(Date.now()));
          try {
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              }).catch(function() {});
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.update().catch(function() {}); }));
              }).catch(function() {});
            }
          } finally {
            window.location.reload();
          }
        }

        function isStaleAssetError(value) {
          var msg = String(value?.message || value?.reason?.message || value?.reason || value || '');
          // Strictly match only genuine Vite chunk/module dynamic import network errors, never generic audio/font preload warnings
          return /ChunkLoadError|Loading chunk [\w-]+ failed|Failed to fetch dynamically imported module|Importing a module script failed/i.test(msg);
        }

        window.addEventListener('vite:preloadError', function(e) {
          e.preventDefault();
          recoverFromStaleAssets();
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (isStaleAssetError(e)) {
            recoverFromStaleAssets();
          }
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Instant redirect to clean URL /orb if opened as /orb.html -->
    <script>
      (function() {
        if (window.location.pathname === '/orb.html') {
          try {
            window.history.replaceState(null, '', '/orb' + window.location.search);
          } catch(e) {}
        }
      })();
    </script>

    <style>

  <body class="bg-[#030308] text-white">
    <div id="root">
      <div style="position:fixed;inset:0;background:#030308;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;user-select:none;overflow:hidden;">

        <!-- 3D Orb & Orbit SVG Stage -->
        <div style="position:relative;display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 280 280" style="width:240px;height:240px;overflow:visible;" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="initOrbSphere" cx="35%" cy="28%" r="72%" fx="32%" fy="24%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
                <stop offset="18%" stop-color="#a5f3fc" stop-opacity="0.9"/>
                <stop offset="42%" stop-color="#38bdf8" stop-opacity="0.75"/>
                <stop offset="70%" stop-color="#818cf8" stop-opacity="0.65"/>
                <stop offset="88%" stop-color="#312e81" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#05050f" stop-opacity="1"/>
              </radialGradient>
              <radialGradient id="initOrbSingularity" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                <stop offset="30%" stop-color="#67e8f9" stop-opacity="0.9"/>
                <stop offset="70%" stop-color="#c084fc" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="initOrbitRing" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
                <stop offset="50%" stop-color="#c084fc" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
              </linearGradient>
            </defs>

            <!-- Tilted Astral Orbit Ring -->
            <ellipse cx="140" cy="140" rx="115" ry="44" fill="none" stroke="url(#initOrbitRing)" stroke-width="1.8" stroke-dasharray="6 4 12 4" transform="rotate(-26 140 140)" opacity="0.8"/>
            <circle cx="215" cy="105" r="3.5" fill="#a5f3fc"/>

            <!-- 3D Crystal Orb Body -->
            <circle cx="140" cy="140" r="68" fill="url(#initOrbSphere)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>

            <!-- Inner Pulsing Core -->
            <circle cx="140" cy="140" r="32" fill="url(#initOrbSingularity)"/>

            <!-- Specular Curved Highlight -->
            <ellipse cx="120" cy="108" rx="32" ry="18" fill="rgba(255,255,255,0.85)" transform="rotate(-28 120 108)" filter="blur(1px)"/>
            <circle cx="110" cy="100" r="4.5" fill="#ffffff"/>

            <!-- Bottom Reflection Glow -->
            <path d="M 100 180 A 68 68 0 0 0 178 180" fill="none" stroke="rgba(165,243,252,0.6)" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- Typography -->
        <div style="margin-top:12px;font-size:24px;font-weight:900;letter-spacing:0.34em;text-transform:uppercase;background:linear-gradient(135deg,#a5f3fc 0%,#38bdf8 50%,#c084fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
          CRYSTAL ORB
        </div>
        <div style="font-size:12px;font-weight:600;letter-spacing:0.16em;color:rgba(165,243,252,0.85);margin-top:8px;">
          크리스탈 오브 차원 궤도 동기화 중...
        </div>
        <div style="font-size:10px;font-family:monospace;letter-spacing:0.2em;color:rgba(192,132,252,0.6);margin-top:4px;text-transform:uppercase;">
          ASTRAL SCRYING SPHERE
        </div>
        
        <!-- Cosmic Progress Bar -->
        <div style="width:200px;height:3px;background:rgba(255,255,255,0.1);border-radius:999px;margin-top:18px;overflow:hidden;position:relative;">
          <div style="width:100%;height:100%;background:linear-gradient(90deg,transparent,#38bdf8,#c084fc,transparent);"></div>
        </div>
      </div>
    </div>
